[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_tool = stlink

; BUG FIX: monitor_port was missing.
; Without this, 'pio device monitor' does not know where to
; connect for RTT output via OpenOCD / J-Link RTT server.
monitor_port = socket://localhost:19021
board_upload.maximum_size = 131072

build_flags =
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float
    -DHAL_IWDG_MODULE_DISABLED

lib_deps =
    claws/BH1750 @ ^1.3.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14