[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink

; Tốc độ Serial Monitor
monitor_speed = 115200

build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC ; Cho phép in ra cổng USB
    -D USBCON                           ; Sử dụng USB Serial