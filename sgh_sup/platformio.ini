[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_port = socket://localhost:19021

; FIX: newlib-nano (default on ARM Arduino) strips out float support
; from sscanf/printf to save flash. This flag restores it.
; Without this, sscanf("%f", ...) silently matches 0 fields.
build_flags =
    -Wl,-u,_scanf_float
    -Wl,-u,_printf_float

lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    knolleary/PubSubClient @ ^2.8
    arduino-libraries/ArduinoHttpClient @ ^0.5.0
    bblanchon/ArduinoJson @ ^7.0.0