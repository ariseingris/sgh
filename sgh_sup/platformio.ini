[env]
; ---- Common settings for ALL environments --------------------------------
platform        = ststm32
board           = bluepill_f103c8
framework       = arduino
upload_protocol = stlink
debug_tool      = stlink
; RTT output via openocd: telnet localhost 19021
monitor_port    = socket://localhost:19021
build_flags =
    -Wl,-u_printf_float
    -Wl,-u_scanf_float
    -DSERIAL_RX_BUFFER_SIZE=256

; ==========================================================================
;  PRODUCTION firmware  (main.cpp + module_sim.cpp)
; ==========================================================================
[env:bluepill_f103c8]
lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    knolleary/PubSubClient @ ^2.8
    arduino-libraries/ArduinoHttpClient @ ^0.6.1
build_src_filter = +<*> -<.git/>

; ==========================================================================
;  TEST 1 — SIM Power & AT Response
;  Sends raw AT commands via USART2 (PA2/PA3), no TinyGSM.
;  Run:  pio run -e test_1 -t upload
; ==========================================================================
[env:test_1]
build_src_filter = -<*> +<../test/test_src/test_1/main.cpp> +<SEGGER_RTT.c>

; ==========================================================================
;  TEST 2 — GPRS / APN Connection
;  Uses TinyGSM to attach to m-wap and get an IP address.
;  Run:  pio run -e test_2 -t upload
; ==========================================================================
[env:test_2]
lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
build_src_filter = -<*> +<../test/test_src/test_2/main.cpp> +<SEGGER_RTT.c>

; ==========================================================================
;  TEST 3 — TCP Connectivity to MQTT Broker
;  Probes port 1883, falls back to 8883, then test.mosquitto.org.
;  Run:  pio run -e test_3 -t upload
; ==========================================================================
[env:test_3]
lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
build_src_filter = -<*> +<../test/test_src/test_3/main.cpp> +<SEGGER_RTT.c>

; ==========================================================================
;  TEST 4 — MQTT Connect + Publish
;  Full MQTT handshake, publishes to sgh/test/ping on HiveMQ.
;  Run:  pio run -e test_4 -t upload
; ==========================================================================
[env:test_4]
lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    knolleary/PubSubClient @ ^2.8
build_src_filter = -<*> +<../test/test_src/test_4/main.cpp> +<SEGGER_RTT.c>

; ==========================================================================
;  TEST 5 — Float JSON Payload Format  (pure firmware, no hardware needed)
;  Verifies -u_printf_float linkage via snprintf and Arduino String().
;  Run:  pio run -e test_5 -t upload
; ==========================================================================
[env:test_5]
build_src_filter = -<*> +<../test/test_src/test_5/main.cpp> +<SEGGER_RTT.c>

; ==========================================================================
;  TEST 6 — Full Pipeline: Mock STM32-A data → GPRS → MQTT → HiveMQ
;  Publishes hardcoded sensor payload, subscribes to control topic.
;  Run:  pio run -e test_6 -t upload
; ==========================================================================
[env:test_6]
lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    knolleary/PubSubClient @ ^2.8
build_src_filter = -<*> +<../test/test_src/test_6/main.cpp> +<SEGGER_RTT.c>
